<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>REAKSI LAB</title>
<style>
:root{--n:#0a1f44;--b:#2f7df6;--c:#22d3ee;--o:#f59e0b;--bg:#f4f8ff;--cd:#fff;--t:#10213f;--m:#55657f;--ln:#dbe6f7;--ok:#0b7d45;--no:#c5221f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--cd:#13203a;--t:#e8eefb;--m:#a5b6d4;--ln:#25375a;--ok:#4ade80;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b1426;--cd:#13203a;--t:#e8eefb;--m:#a5b6d4;--ln:#25375a;--ok:#4ade80;--no:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--b)}nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--n);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{color:#fff;font-weight:800;font-size:20px;text-decoration:none}.logo b{color:var(--c)}
nav .lk{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}nav .lk a{color:#cfe0ff;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}nav .lk a.on,nav .lk a:hover{color:#fff;background:#ffffff1f}
#hb{display:none;background:none;border:1px solid #fff6;color:#fff;border-radius:8px;padding:6px 10px;font-size:20px;margin-left:auto}
.btn{background:var(--c);color:#06203f;border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:15px}
.btn.g{background:transparent;border:1.5px solid var(--b);color:var(--b)}.btn.w{background:transparent;border:1.5px solid #fff;color:#fff}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--o);outline-offset:2px}
main{max-width:1050px;margin:0 auto;padding:24px 16px}
.hero{position:relative;background:linear-gradient(135deg,#071530,#0f3a7a);color:#fff;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}.hero .in{position:relative;max-width:1050px;margin:auto;padding:70px 16px}
.hero h1{font-size:clamp(40px,8vw,72px);margin:0;line-height:1}.hero h1 b{color:var(--c)}.hero .tg{color:var(--c);font-size:22px;font-weight:600;margin:10px 0}
.hero p{max-width:560px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:18px;margin:14px 0}.grid .card{margin:0}
h2{margin:6px 0 4px}h3{margin:0 0 6px}.sm{font-size:13px;color:var(--m)}.tag{display:inline-block;background:#22d3ee33;color:var(--b);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c));transition:width .5s}
canvas.sc{width:100%;max-width:600px;border-radius:12px;display:block}
.op{display:block;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;margin:6px 0;cursor:pointer}
.in{padding:9px;border-radius:8px;border:1px solid var(--m);background:var(--cd);color:var(--t);font-size:15px;margin:4px 4px 4px 0}
.fb{margin-top:10px;padding:10px;border-radius:10px;display:none}.fb.good{display:block;border-left:5px solid var(--ok);background:#0b7d4518}.fb.bad{display:block;border-left:5px solid var(--no);background:#c5221f14}
.tb{border-collapse:collapse;width:100%}.tb td,.tb th{border:1px solid var(--ln);padding:8px;text-align:center}
.chip{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--n);color:#fff;margin:4px;cursor:pointer;user-select:none;border:2px solid transparent}.chip.sel{border-color:var(--o)}
.zn{padding:10px;border:2px dashed var(--b);border-radius:10px;margin:6px 0;cursor:pointer}
svg text{fill:var(--t);font-size:11px}.hit{fill:transparent;cursor:pointer}.hit:hover{fill:#f59e0b44}
footer{background:var(--n);color:#cfe0ff;padding:24px 20px 12px;margin-top:30px}footer .f{max-width:1050px;margin:auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:#cfe0ff;margin-right:12px;text-decoration:none}footer .cr{text-align:right;font-size:12px;max-width:1050px;margin:14px auto 0;color:#9db4de}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--o);color:#201400;padding:10px 16px;border-radius:10px;font-weight:700;z-index:20}
.refs a{word-break:break-all}input[type=range]{width:100%;max-width:340px}
@media(max-width:820px){#hb{display:block}nav .lk{display:none;width:100%;flex-direction:column}nav .lk.open{display:flex}nav .btn{display:none}}
</style></head><body>
<nav><a class="logo" href="#/home">⚛ REAKSI <b>LAB</b></a><button id="hb" aria-label="Menu">☰</button><div class="lk" id="lk"></div><a class="btn" href="#/map">Mulai Belajar</a></nav>
<div id="app"></div>
<footer><div class="f"><div><b style="color:#fff">REAKSI LAB</b><br><span class="sm" style="color:#9db4de">Interactive Learning Environment for Reaction Rate</span></div><div><a href="#/home">Beranda</a><a href="#/map">Materi</a><a href="#/lab">Laboratorium</a><a href="#/games">Games</a><a href="#/eval">Evaluasi</a></div></div><div class="cr">@Nextto Krisman Waruwu</div></footer>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
let S;try{S=JSON.parse(localStorage.getItem('rl')||'')}catch(e){}S=S||{xp:0,d:{},ev:null};
const sv=()=>{try{localStorage.setItem('rl',JSON.stringify(S))}catch(e){}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1800)}
const done=(id,xp)=>{if(!S.d[id]){S.d[id]=1;S.xp+=xp;sv();toast('+'+xp+' XP')}};
const R=[['OpenStax. 2019. Chemistry 2e (Bab 12: Kinetics). OpenStax.','https://openstax.org/details/books/chemistry-2e'],['IUPAC. Compendium of Chemical Terminology (the "Gold Book"): entri activation energy, catalyst, rate law, order of reaction.','https://goldbook.iupac.org']];
const MD=[
{t:'Teori Tumbukan',d:'Memahami bagaimana tumbukan antarpartikel menghasilkan reaksi.',i:'⚛️',a:['read1','sim','game'],c:[['Pengertian','Reaksi terjadi ketika partikel pereaksi bertumbukan. Tidak semua tumbukan menghasilkan produk.'],['Gerakan partikel','Partikel selalu bergerak acak. Makin tinggi suhu, makin cepat geraknya.'],['Tumbukan antarpartikel','Dua partikel bertemu lalu saling memantul atau bereaksi.'],['Tumbukan efektif','Tumbukan yang menghasilkan reaksi: energi cukup DAN orientasi tepat.'],['Energi tumbukan','Energi kinetik harus mencapai batas minimum agar ikatan lama putus.'],['Orientasi tumbukan','Bagian partikel yang bertemu harus sesuai. Orientasi salah → hanya memantul.'],['Energi aktivasi (Ea)','Energi minimum agar tumbukan menghasilkan reaksi.'],['Kaitan dengan laju','Laju reaksi bergantung pada banyaknya tumbukan efektif per satuan waktu.']]},
{t:'Faktor Laju Reaksi',d:'Konsentrasi, luas permukaan, suhu, dan katalis.',i:'🧪',a:['conc','surf','temp','cat'],c:[['Apa itu faktor laju?','Laju reaksi dipengaruhi konsentrasi, luas permukaan, suhu, dan katalis. Semuanya bekerja lewat tumbukan efektif.'],['Konsentrasi','Konsentrasi besar berarti partikel per satuan volume banyak, sehingga tumbukan lebih sering.'],['Luas permukaan','Padatan berukuran kecil punya permukaan lebih luas, sehingga lebih banyak partikel dapat bertumbukan.'],['Suhu','Suhu naik → partikel bergerak lebih cepat → lebih banyak tumbukan berenergi ≥ Ea.'],['Katalis','Zat yang mempercepat reaksi lewat jalur dengan Ea lebih rendah, tanpa habis bereaksi.'],['Faktor mana yang mengubah Ea?','Hanya katalis yang menurunkan Ea. Faktor lain mengubah frekuensi atau energi tumbukan.'],['Satu pola','Semua faktor → tumbukan efektif per detik naik → laju naik.'],['Cara belajar','Gunakan simulator di bawah. Ubah satu variabel saja setiap kali (variabel kontrol).']]},
{t:'Energi Aktivasi',d:'Memahami energi aktivasi dan peran katalis.',i:'📈',a:['graph','why'],c:[['Grafik energi potensial','Grafik menunjukkan perubahan energi selama reaksi. Sumbu x: koordinat reaksi, sumbu y: energi potensial.'],['Energi pereaksi & produk','Tingkat energi awal (pereaksi) dan akhir (produk) ditunjukkan dataran di kiri dan kanan kurva.'],['Energi aktivasi (Ea)','Selisih energi puncak dan energi pereaksi: Ea = E puncak − E pereaksi.'],['ΔH reaksi','ΔH = E produk − E pereaksi. Negatif: eksotermik; positif: endotermik.'],['Keadaan transisi','Puncak kurva adalah keadaan peralihan: ikatan lama melemah dan ikatan baru mulai terbentuk.'],['Peran katalis','Katalis membuka jalur alternatif dengan puncak lebih rendah, sehingga Ea turun.'],['ΔH tidak berubah','Energi pereaksi dan produk tetap sama, sehingga ΔH tidak diubah oleh katalis.'],['Mengapa lebih cepat?','Ea lebih rendah → lebih banyak partikel berenergi cukup → tumbukan efektif naik → laju naik.']]},
{t:'Hukum Laju',d:'Memahami hubungan konsentrasi dan laju reaksi.',i:'📄',a:['read4','match','eq'],c:[['Laju reaksi','Perubahan konsentrasi pereaksi/produk per satuan waktu (M/s).'],['Hukum laju','Persamaan yang menghubungkan laju dengan konsentrasi pereaksi.'],['Bentuk umum','v = k[A]ᵐ[B]ⁿ — ditentukan dari eksperimen, bukan dari koefisien reaksi.'],['Arti simbol','v = laju, k = konstanta laju, m = orde terhadap A, n = orde terhadap B, m+n = orde total.'],['Orde nol','[A] naik 2× → laju tetap.'],['Orde satu','[A] naik 2× → laju naik 2×.'],['Orde dua','[A] naik 2× → laju naik 2² = 4×.'],['Konsentrasi & laju','Orde menunjukkan seberapa kuat laju dipengaruhi konsentrasi.']]},
{t:'Analisis Data Reaksi',d:'Menentukan orde, persamaan laju, dan konstanta laju.',i:'📊',a:['lab','kcalc'],c:[['Mengapa butuh data?','Orde reaksi tidak bisa ditebak dari koefisien reaksi; harus ditentukan dari eksperimen.'],['Variabel kontrol','Bandingkan dua percobaan yang hanya mengubah satu konsentrasi.'],['Langkah menentukan orde','Cari faktor perubahan konsentrasi dan faktor perubahan laju, lalu cocokkan.'],['Hubungan faktor','(faktor konsentrasi)ᵐ = faktor laju. Contoh: 2ᵐ = 4 → m = 2.'],['Orde total','Jumlahkan semua orde: m + n.'],['Persamaan laju','Susun v = k[A]ᵐ[B]ⁿ dengan m dan n dari hasil analisis.'],['Menghitung k','k = v / ([A]ᵐ[B]ⁿ), memakai data satu percobaan.'],['Satuan k','Satuan k bergantung pada orde total: M^(1−(m+n)) s⁻¹.']]}];
const ACT=MD.flatMap(m=>m.a);
const mp=i=>MD[i].a.filter(a=>S.d[a]).length/MD[i].a.length;
const st=p=>p==0?'Belum dimulai':p==1?'Selesai':'Sedang dipelajari';

// engine
function sim(cv,P,cb){const c=cv.getContext('2d'),W=cv.width,H=cv.height,ps=[],fl=[];let col=0,ef=0,key='',last='';
(function f(){if(!cv.isConnected)return;const p=P(),k=JSON.stringify(p);if(k!=key){key=k;col=ef=0;last=''}
while(ps.length<p.n)ps.push({x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.28,k:ps.length%2,cd:0});ps.length=p.n;
c.fillStyle='#071530';c.fillRect(0,0,W,H);
ps.forEach(q=>{const s=p.v*1.5;q.x+=Math.cos(q.a)*s;q.y+=Math.sin(q.a)*s;if(q.x<7||q.x>W-7){q.a=Math.PI-q.a;q.x=Math.min(W-7,Math.max(7,q.x))}if(q.y<7||q.y>H-7){q.a=-q.a;q.y=Math.min(H-7,Math.max(7,q.y))}q.cd--});
for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j];if(a.cd>0||b.cd>0||Math.hypot(a.x-b.x,a.y-b.y)>14)continue;
col++;const ori=Math.random()<.5,en=p.E+Math.random()*4-2>=6,e=ori&&en;if(e)ef++;
last=e?'EFEKTIF — energi cukup dan orientasi tepat':'TIDAK EFEKTIF — '+(!en&&!ori?'energi kurang & orientasi salah':!en?'energi kurang dari Ea':'orientasi salah');
fl.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,e,t:25});a.cd=b.cd=20;a.a+=2.5;b.a-=2.5}
ps.forEach(q=>{c.fillStyle=q.k?'#f59e0b':'#38a1ff';c.beginPath();c.arc(q.x,q.y,6,0,6.3);c.fill()});
fl.forEach((x,i)=>{c.strokeStyle=x.e?'#22d3ee':'#fff';c.lineWidth=x.e?3:1.5;c.beginPath();c.arc(x.x,x.y,x.e?20-x.t/2:10+(25-x.t)/3,0,6.3);c.stroke();x.t--});
for(let i=fl.length-1;i>=0;i--)if(fl[i].t<0)fl.splice(i,1);
if(cb)cb(col,ef,last);requestAnimationFrame(f)})()}
function simUI(box,ctrls,mk,onC){const V={};box.innerHTML=ctrls.map(([id,l,mn,mx,v,s,u])=>{V[id]=v;return`<label for="${id}">${l}: <b id="o${id}">${v}${u||''}</b></label><br><input type="range" id="${id}" min="${mn}" max="${mx}" value="${v}" step="${s}"><br>`}).join('')+`<canvas class="sc" width="600" height="300" aria-label="Simulasi partikel"></canvas><p class="sm">Data Simulasi · <span class="stt"></span></p><p><b class="ls" role="status">Menunggu tumbukan…</b></p>`;
ctrls.forEach(([id,,,,,,u])=>$('#'+id,box).oninput=e=>{V[id]=+e.target.value;$('#o'+id,box).textContent=e.target.value+(u||'')});
sim($('canvas',box),()=>mk(V),(c,e,l)=>{$('.stt',box).textContent=`Tumbukan: ${c} · Efektif: ${e} (${c?Math.round(e/c*100):0}%)`;$('.ls',box).textContent=l||'Menunggu tumbukan…';onC&&onC(c)})}

// quiz
function Q(q,box,cb){const hs=(q.h||'').split('|');let hi=0,ok=0;
box.innerHTML=`<p><b>${q.p}</b></p><div class="qi"></div><div class="row"><button class="btn bk">Periksa Jawaban</button><button class="btn g bh">Lihat Petunjuk</button><a class="btn g" href="${q.l||'#/map'}">Pelajari Konsep</a></div><div class="fb" role="status" aria-live="polite"></div>`;
const qi=$('.qi',box),fb=$('.fb',box),idn='q'+Math.random();
if(q.t=='mc')qi.innerHTML=q.o.map((o,i)=>`<label class="op"><input type="radio" name="${idn}" value="${i}"> ${o}</label>`).join('');
if(q.t=='num')qi.innerHTML=`<input class="in" inputmode="decimal" aria-label="Jawaban angka" placeholder="Jawaban"> ${q.u||''}`;
if(q.t=='fill')qi.innerHTML=q.f.map((o,j)=>`<select class="in" aria-label="Isian ${j+1}"><option value="-1">— pilih —</option>${o.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select>`).join(' ');
const hint=()=>{if(hs[0]){const x=hs[Math.min(hi++,hs.length-1)];fb.className='fb bad';fb.innerHTML=(fb.dataset.w||'')+'<b>Petunjuk:</b> '+x}};
$('.bh',box).onclick=hint;
$('.bk',box).onclick=e=>{if(ok)return;let g;
if(q.t=='mc'){const r=$('input:checked',qi);if(!r)return;g=+r.value==q.a}
if(q.t=='num')g=Math.abs(parseFloat($('input',qi).value.replace(',','.'))-q.a)<=(q.tol||1e-6);
if(q.t=='fill')g=$$('select',qi).every((s,j)=>+s.value==q.a[j]);
if(g){ok=1;fb.className='fb good';fb.innerHTML='✓ Tepat!<br>'+q.ok;cb&&cb(1)}
else if(q.once){ok=1;fb.className='fb bad';fb.innerHTML='✗ Belum tepat.<br>'+q.ok;cb&&cb(0)}
else{fb.dataset.w='✗ Belum tepat. '+(q.w||'Perhatikan kembali konsepnya.')+'<br>';hint();e.target.textContent='Coba Lagi'}}}

// graph
function graph(box,click,cb){box.innerHTML=`<svg viewBox="0 0 400 240" role="img" aria-label="Grafik energi potensial terhadap koordinat reaksi" style="width:100%;max-width:560px"><line x1="40" y1="10" x2="40" y2="210" stroke="#888"/><line x1="40" y1="210" x2="390" y2="210" stroke="#888"/><text x="10" y="120" transform="rotate(-90 14 120)">Energi potensial (kJ)</text><text x="150" y="230">Koordinat reaksi</text>
<path d="M40,150H90C130,150 140,40 200,40C260,40 270,190 310,190H380" fill="none" stroke="#2f7df6" stroke-width="3"/>
<path class="cat" d="M40,150H90C130,150 150,95 200,95C250,95 270,190 310,190H380" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3"/>
<line x1="170" y1="150" x2="170" y2="40" stroke="#2f7df6"/><text x="120" y="100">Ea (tanpa)</text>
<g class="cat"><line x1="235" y1="150" x2="235" y2="95" stroke="#f59e0b"/><text x="240" y="125">Ea (katalis)</text></g>
<line x1="350" y1="150" x2="350" y2="190" stroke="#888"/><text x="355" y="173">ΔH</text><text x="42" y="144">Pereaksi</text><text x="316" y="204">Produk</text>
<text x="230" y="30" style="fill:#2f7df6">— tanpa katalis</text><g class="cat"><text x="300" y="30" style="fill:#b97700">-- dengan katalis</text></g>
${click?`<rect class="hit" id="er" x="40" y="135" width="60" height="25"/><rect class="hit" id="ep" x="310" y="178" width="60" height="25"/><rect class="hit" id="ea0" x="158" y="40" width="24" height="110"/><rect class="hit" id="ea1" x="222" y="95" width="24" height="55"/><rect class="hit" id="dh" x="338" y="150" width="26" height="40"/>`:''}</svg><p class="sm">Data Simulasi · reaksi eksotermik (ΔH &lt; 0)</p>`;
if(!click)return;const T=[['ea0','Ea tanpa katalis (garis biru)'],['ea1','Ea dengan katalis (garis oranye putus-putus)'],['er','energi pereaksi'],['ep','energi produk'],['dh','ΔH']];let i=0;
box.insertAdjacentHTML('beforeend','<p><b id="tk"></b></p><p id="gf" role="status"></p>');const sh=()=>$('#tk',box).textContent=i<5?`Tugas ${i+1}/5: klik ${T[i][1]}`:'Semua tugas selesai ✓';sh();
$$('.hit',box).forEach(r=>r.onclick=()=>{if(i>4)return;if(r.id==T[i][0]){r.style.fill='#0b7d4555';$('#gf',box).textContent='✓ Tepat! '+T[i][1]+' teridentifikasi.';i++;sh();if(i==5){done('graph',50);cb&&cb()}}else $('#gf',box).textContent='✗ Belum tepat. Petunjuk: Ea adalah selisih energi puncak dan pereaksi; ΔH adalah selisih produk dan pereaksi.'})}

// helpers
const sec=(h,cls='')=>{const d=document.createElement('section');d.className='card '+cls;d.innerHTML=h;return d};
const cards=(c)=>`<div class="grid">${c.map(([a,b],i)=>`<div class="card"><span class="tag">${i+1}</span><h3>${a}</h3><p>${b}</p></div>`).join('')}</div>`;
const refs=()=>sec(`<h3>📚 Sumber Belajar</h3><ul class="refs">${R.map(r=>`<li>${r[0]} <a href="${r[1]}" target="_blank" rel="noopener">${r[1]}</a></li>`).join('')}</ul><p class="sm">Materi ditulis ulang secara pedagogis untuk kelas XI.</p>`);
const head=(i)=>sec(`<span class="tag">MODUL 0${i+1}</span><h2>${MD[i].t.toUpperCase()}</h2><p>${MD[i].d}</p><div class="bar"><i style="width:${mp(i)*100}%"></i></div>`);
const ok=(m)=>m;

function match(box){const it=[['[A] naik 2× → laju tetap',0],['[A] naik 2× → laju naik 2×',1],['[A] naik 2× → laju naik 4×',2],['[A] naik 3× → laju naik 3×',1]],V={};let sel=null;
box.innerHTML=`<h3>Rate Law Game</h3><p class="sm">Seret (atau pilih lalu klik) orde ke tiap pernyataan.</p><div>${[0,1,2].map(i=>`<span class="chip" tabindex="0" draggable="true" data-v="${i}">Orde ${i}</span>`).join('')}</div>${it.map((x,i)=>`<div class="zn" tabindex="0" data-i="${i}">${x[0]} → <b>…</b></div>`).join('')}<button class="btn">Periksa</button><p id="mr" role="status"></p>`;
